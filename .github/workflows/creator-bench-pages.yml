name: Deploy Creator Bench to GitHub Pages
on:
  push:
    branches: [claude/quirky-feynman-4ribkf]
    paths: ['tool-sites/creator/dist/**', '.github/workflows/creator-bench-pages.yml']
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: tool-sites/creator/dist
      - id: deployment
        uses: actions/deploy-pages@v4
