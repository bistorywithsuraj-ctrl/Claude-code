</style></head><body><canvas id="c" width="1920" height="1080"></canvas>
<script src="data.js"></script>
<script>
// "I'm Open" music video. 1920x1080, every frame is a pure function of song time t (seconds).
const W = 1920, H = 1080, cv = document.getElementById('c'), x = cv.getContext('2d'), DUR = 244.2;
const cl = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v)), inv = (a, b, t) => cl((t - a) / (b - a)), lerp = (a, b, p) => a + (b - a) * p;
const eOut = p => 1 - Math.pow(1 - p, 3), eIn = p => p * p * p, eIO = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2, eBack = p => { const c = 1.7; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const rnd = s => { const v = Math.sin(s * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); };
const C = { bg: '#050608', mint: '#B4F8EA', glow: '#5FF0C9', coral: '#FF6B57', peach: '#FFA27A', pink: '#F7B4C6', ink: '#E9F2EF', dim: '#5B666E', panel: '#0B0F12', line: '#1C262B', red: '#FF4D4D' };
const fr = t => Math.min(ENV.length - 1, Math.max(0, Math.floor(t * 30)));
const env = t => envS(t), kick = t => KICK[fr(t)], low = t => LOW[fr(t)];
const kickDecay = t => { const f = t * 30, i0 = Math.floor(f), u = f - i0; let m = 0; for (let i = 0; i < 12; i++) { const j = Math.max(0, i0 - i); m = Math.max(m, (KICK[j] || 0) * Math.pow(.8, i + u)); } return m; };
const envS = t => { const f = t * 30, i = Math.floor(f), u = f - i; return lerp(ENV[Math.min(ENV.length - 1, Math.max(0, i))], ENV[Math.min(ENV.length - 1, Math.max(0, i + 1))], u); };
const wt = (l, w = 0) => LY[l].w[Math.min(w, LY[l].w.length - 1)][1];
function T(s, X, Y, f, c, o = {}) { x.save(); x.font = f; x.fillStyle = c; x.textAlign = o.al || 'center'; x.textBaseline = o.bl || 'middle'; x.globalAlpha *= o.a ?? 1; if (o.ls) x.letterSpacing = o.ls + 'px'; if (o.glow) { x.shadowColor = o.glow; x.shadowBlur = o.gb || 24; } x.fillText(s, X, Y); x.restore(); }
function rr(X, Y, w, h, r) { x.beginPath(); x.roundRect(X, Y, w, h, r); }
function mk(w, h, fn) { const c = document.createElement('canvas'); c.width = w; c.height = h; fn(c.getContext('2d'), w, h); return c; }

// ---------- sprites ----------
const GLOW = mk(256, 256, (g) => { const r = g.createRadialGradient(128, 128, 0, 128, 128, 128); r.addColorStop(0, 'rgba(180,248,234,.9)'); r.addColorStop(.25, 'rgba(95,240,201,.45)'); r.addColorStop(.6, 'rgba(95,240,201,.08)'); r.addColorStop(1, 'rgba(95,240,201,0)'); g.fillStyle = r; g.fillRect(0, 0, 256, 256); });
const CORE = mk(512, 512, (g) => { // grainy pale-mint disk like the cover art
  for (let i = 0; i < 26000; i++) { const a = rnd(i) * 6.283, d = Math.pow(rnd(i + .5), .55) * 200 + (rnd(i + .7) - .5) * 26, X = 256 + Math.cos(a) * d, Y = 256 + Math.sin(a) * d, k = 1 - d / 230;
    g.fillStyle = `rgba(${200 + 40 * rnd(i + 2) | 0},${245},${232 + 20 * rnd(i + 3) | 0},${cl(k * 1.4) * .5})`; g.fillRect(X, Y, 2.2, 2.2); }
  const r = g.createRadialGradient(256, 256, 0, 256, 256, 200); r.addColorStop(0, 'rgba(230,255,248,.65)'); r.addColorStop(.75, 'rgba(180,248,234,.35)'); r.addColorStop(1, 'rgba(180,248,234,0)'); g.fillStyle = r; g.beginPath(); g.arc(256, 256, 200, 0, 7); g.fill(); });
const SMOKE = mk(512, 512, (g) => { for (let i = 0; i < 900; i++) { const a = rnd(i * 3) * 6.283, d = 70 + Math.pow(rnd(i * 3 + 1), .8) * 180, X = 256 + Math.cos(a) * d, Y = 256 + Math.sin(a) * d * .8, s = 6 + rnd(i * 3 + 2) * 26;
  const c = rnd(i * 7) < .6 ? '255,107,87' : rnd(i * 7) < .85 ? '255,162,122' : '247,180,198'; const r = g.createRadialGradient(X, Y, 0, X, Y, s); r.addColorStop(0, `rgba(${c},.16)`); r.addColorStop(1, `rgba(${c},0)`); g.fillStyle = r; g.fillRect(X - s, Y - s, s * 2, s * 2); } });
const GRAIN = mk(512, 512, (g) => { const d = g.createImageData(512, 512); for (let i = 0; i < d.data.length; i += 4) { const v = rnd(i * .37) * 255; d.data[i] = d.data[i + 1] = d.data[i + 2] = v; d.data[i + 3] = 18; } g.putImageData(d, 0, 0); });
const GRAIN_P = x.createPattern(GRAIN, 'repeat');
const DUST = Array.from({ length: 220 }, (_, i) => ({ x: rnd(i) * W, y: rnd(i + 9) * H, z: .2 + rnd(i + 3) * .8, c: rnd(i + 5) < .75 ? C.mint : C.coral }));

// ---------- mascot: the orb from the cover, with pixel eyes ----------
function orb(X, Y, R, t, o = {}) {
  const e = env(t), k = kickDecay(t), a = o.a ?? 1; if (a <= 0 || R < .5) return;
  x.save(); x.globalAlpha *= a; x.translate(X, Y);
  if (!o.noSmoke) { x.globalCompositeOperation = 'lighter'; for (let i = 0; i < 3; i++) { x.save(); x.rotate(t * (.07 + i * .03) * (i % 2 ? -1 : 1) + i * 2); const s = R * (3.1 + i * .35 + e * .3); x.globalAlpha *= .55 + e * .35; x.drawImage(SMOKE, -s, -s, s * 2, s * 2); x.restore(); } x.globalCompositeOperation = 'source-over'; }
  const g = R * (3 + k * .9 + e * .5); x.globalCompositeOperation = 'lighter'; x.drawImage(GLOW, -g, -g, g * 2, g * 2); x.globalCompositeOperation = 'source-over';
  const c = R * (1.28 + k * .05); x.save(); x.rotate(t * .2); x.drawImage(CORE, -c, -c, c * 2, c * 2); x.restore();
  if (!o.noEyes && R > 10) { const bl = (t + (o.seed || 0)) % 4.3 < .13 ? .15 : 1, lx = (o.look || 0) * R * .12, ew = R * .16, eh = R * .3 * bl;
    x.fillStyle = '#0B1A17'; [-1, 1].forEach(s => { rr(s * R * .26 - ew / 2 + lx, -R * .08 - eh / 2, ew, eh, ew * .3); x.fill(); }); }
  x.restore();
}
// many tiny orbs (no eyes) drawn cheaply
function miniOrb(X, Y, R, a = 1) { x.globalAlpha = a; x.drawImage(GLOW, X - R * 3, Y - R * 3, R * 6, R * 6); x.drawImage(CORE, X - R * 1.2, Y - R * 1.2, R * 2.4, R * 2.4); x.globalAlpha = 1; }

// ---------- shared UI ----------
function panel(X, Y, w, h, title, o = {}) {
  x.save(); x.globalAlpha *= o.a ?? 1; x.shadowColor = 'rgba(0,0,0,.6)'; x.shadowBlur = 40; x.fillStyle = TH.panel; if (TH === LIGHT) x.shadowColor = 'rgba(60,50,30,.15)'; rr(X, Y, w, h, 18); x.fill(); x.shadowBlur = 0;
  x.strokeStyle = o.stroke || TH.line; x.lineWidth = 2; rr(X, Y, w, h, 18); x.stroke();

    T(title, X + 104, Y + 27, '500 20px JB', TH.sub, { al: 'left' }); if (o.right) T(o.right, X + w - 24, Y + 27, '700 20px JB', C.glow, { al: 'right' }); }
  x.restore();
}
function cursor(X, Y, s = 1, press = 0) { x.save(); x.translate(X, Y); x.scale(s * (1 - press * .15), s * (1 - press * .15)); x.fillStyle = '#fff'; x.strokeStyle = '#000'; x.lineWidth = 3;
  x.beginPath(); x.moveTo(0, 0); x.lineTo(0, 46); x.lineTo(12, 35); x.lineTo(21, 54); x.lineTo(29, 50); x.lineTo(20, 32); x.lineTo(36, 32); x.closePath(); x.stroke(); x.fill(); x.restore(); }
function stamp(s, X, Y, t0, t, col = C.coral, size = 54, rot = -.12) { const p = inv(t0, t0 + .22, t); if (p <= 0) return; const sc = lerp(2.2, 1, eOut(p));
  x.save(); x.translate(X, Y); x.rotate(rot); x.scale(sc, sc); x.globalAlpha *= p; x.font = `900 ${size}px IT`; const w = x.measureText(s).width + 40;
  x.strokeStyle = col; x.lineWidth = 6; rr(-w / 2, -size * .75, w, size * 1.5, 12); x.stroke(); T(s, 0, 2, `900 ${size}px IT`, col, { ls: 2 }); x.restore(); }
function fileIcon(X, Y, s, label, o = {}) { x.save(); x.translate(X, Y); x.scale(s, s); x.globalAlpha *= o.a ?? 1;
  x.fillStyle = '#10181B'; x.strokeStyle = C.glow; x.lineWidth = 3; x.beginPath(); x.moveTo(-60, -80); x.lineTo(30, -80); x.lineTo(60, -50); x.lineTo(60, 80); x.lineTo(-60, 80); x.closePath(); x.fill(); x.stroke();
  x.beginPath(); x.moveTo(30, -80); x.lineTo(30, -50); x.lineTo(60, -50); x.stroke(); orb(0, -5, 24, o.t || 0, { noSmoke: 1, seed: o.seed });
  if (label) T(label, 0, 112, '700 22px JB', C.mint); x.restore(); }

// ---------- lyrics ----------
function lineAt(t) { let k = -1; for (let i = 0; i < LY.length; i++) if (LY[i].s - .35 <= t) k = i; if (k < 0) return -1; const L = LY[k], nx = LY[k + 1];
  if (t > L.e + 1.6 || (nx && t > nx.s - .35)) return -1; return k; }
function lyrics(t, Y = 950, o = {}) {
  const k = lineAt(t); if (k < 0) return; const L = LY[k], fade = Math.min(inv(L.s - .35, L.s - .05, t), 1 - inv(L.e + 1.1, L.e + 1.6, t));
  let size = o.size || 66; x.font = `800 ${size}px IT`; const words = L.w.map(w => w[0]); let sp = size * .28;
  let tw = () => words.reduce((a, w) => a + x.measureText(w).width, 0) + sp * (words.length - 1);
  while (tw() > 1600 && size > 36) { size -= 4; sp = size * .28; x.font = `800 ${size}px IT`; }
  let X = W / 2 - tw() / 2; const lin = eOut(inv(L.s - .35, L.s + .1, t)), lout = eIn(inv(L.e + 1.1, L.e + 1.6, t)); Y += (1 - lin) * 26 - lout * 22;
  words.forEach((w, i) => { const ws = x.measureText(w).width, st = L.w[i][1], nxt = i < words.length - 1 ? L.w[i + 1][1] : L.e + .8, sung = t >= st, p = eOut(inv(st - .05, st + .22, t)), hl = inv(st - .05, st + .1, t) * (1 - inv(nxt, nxt + .25, t)), cur = hl > .5;
    x.save(); x.translate(X + ws / 2, Y - p * 6); const sc = 1 + .05 * Math.sin(Math.PI * cl(p)) * (hl > 0 ? 1 : 0); x.scale(sc, sc); x.globalAlpha = fade * lerp(.22, 1, p);
    x.shadowColor = `rgba(95,240,201,${hl * .9})`; x.shadowBlur = 10 + hl * 22;
    x.font = `800 ${size}px IT`; x.textAlign = 'center'; x.textBaseline = 'middle'; const m = [180, 248, 234]; x.fillStyle = `rgb(${lerp(255, m[0], hl) | 0},${lerp(255, m[1], hl) | 0},${lerp(255, m[2], hl) | 0})`; x.fillText(w, 0, 0);
    if (sung && !cur) { x.shadowBlur = 0; x.fillStyle = C.glow; x.save(); x.beginPath(); x.rect(-ws / 2, -size, x.measureText(w[0]).width, size * 2); x.clip(); x.fillText(w, 0, 0); x.restore(); }
    x.restore(); X += ws + sp; });
}

// ---------- 3D letter tiles (chorus) ----------
function tile(ch, X, Y, S, t, drop, glowAmt) {
  const p = inv(drop, drop + .28, t); if (p <= 0) return; const yy = Y - (1 - eOut(p)) * 260, sc = p < 1 ? lerp(1.25, 1, eOut(p)) : 1, dx = S * .07, dy = S * .09;
  x.save(); x.translate(X, yy); x.scale(sc, sc); x.globalAlpha *= cl(p * 2);
  x.fillStyle = '#071311'; rr(-S / 2 + dx, -S / 2 + dy, S, S, S * .14); x.fill(); // extrusion
  for (let i = 1; i <= 6; i++) { x.fillStyle = `rgba(${20 + i * 4},${60 + i * 8},${50 + i * 6},1)`; rr(-S / 2 + dx * i / 6, -S / 2 + dy * i / 6, S, S, S * .14); x.fill(); }
  x.fillStyle = '#0E1C19'; rr(-S / 2, -S / 2, S, S, S * .14); x.fill();
  x.save(); x.clip(); for (let i = 0; i < 70; i++) { x.fillStyle = `rgba(180,248,234,${.03 + rnd(i + ch.charCodeAt(0)) * .05})`; x.fillRect(-S / 2 + rnd(i * 2 + ch.charCodeAt(0)) * S, -S / 2 + rnd(i * 3 + 1) * S, 3, 3); } x.restore();
  x.shadowColor = C.glow; x.shadowBlur = 18 + glowAmt * 40; x.strokeStyle = C.glow; x.lineWidth = S * .05; rr(-S / 2 + S * .06, -S / 2 + S * .06, S * .88, S * .88, S * .1); x.stroke();
  const gr = x.createLinearGradient(0, -S * .4, 0, S * .4); gr.addColorStop(0, '#E8FFF9'); gr.addColorStop(1, '#5FF0C9'); x.fillStyle = gr; x.shadowBlur = 20 + glowAmt * 50;
  x.font = `900 ${S * .66}px IT`; x.textAlign = 'center'; x.textBaseline = 'middle'; x.fillText(ch, 0, S * .04); x.restore();
}
function tiles(word, pre, cx, cy, S, t, t0, a = 1) {
  if (a <= 0) return; x.save(); x.globalAlpha *= a; const gap = S * .22, n = word.length, w0 = n * S + (n - 1) * gap, g = kickDecay(t);
  if (pre) T(pre, cx - w0 / 2, cy - S * .5 - S * .32, `italic ${S * .38}px IS`, C.peach, { al: 'left', a: inv(t0 - .3, t0, t) });
  for (let i = 0; i < n; i++) tile(word[i], cx - w0 / 2 + S / 2 + i * (S + gap), cy + Math.sin(t * 2 + i) * S * .02, S, t, t0 + i * .09, g);
  x.restore();
}

// ---------- background ----------
// ---------- scenes ----------
function sIntro(t) {
  const pa = 1 - inv(6.4, 7.4, t); if (pa > 0) { panel(W / 2 - 480, 330, 960, 330, 'terminal — ~/models', { a: pa * inv(.2, .8, t) });
    x.save(); x.globalAlpha = pa; const L1 = '$ ./release --weights=public', n = Math.floor(L1.length * inv(.9, 3, t));
    T(L1.slice(0, n) + (t < 3.3 && (t * 2 | 0) % 2 ? '▌' : ''), W / 2 - 440, 430, '500 30px JB', C.ink, { al: 'left' });
    if (t > 3.3) { const p = inv(3.3, 5.2, t), bars = Math.floor(p * 24); T('  uploading shards ' + '█'.repeat(bars) + '░'.repeat(24 - bars) + ` ${Math.round(p * 100)}%`, W / 2 - 440, 490, '500 26px JB', C.dim, { al: 'left' }); }
    if (t > 5.4) T('  ✓ published. no login required.', W / 2 - 440, 550, '700 28px JB', C.glow, { al: 'left', a: inv(5.4, 5.7, t) });
    x.restore(); }
  const ob = inv(6.2, 8, t); if (ob > 0) { for (let i = 0; i < 160; i++) { const a = rnd(i) * 6.283, d = (1 - eOut(ob)) * (300 + rnd(i + 1) * 600); x.fillStyle = C.mint; x.globalAlpha = ob * .8; x.fillRect(W / 2 + Math.cos(a) * d, 470 + Math.sin(a) * d, 3, 3); } x.globalAlpha = 1;
    orb(W / 2, 470, 90 * eOut(ob), t, { a: ob }); }
}
function sTorrent(t) {
  const a = inv(7.6, 8.3, t), X = W / 2 - 600, Y = 230; panel(X, Y, 1200, 470, 'torrent — 1 file', { a, right: t > 9.7 ? '▲ seeding' : '' });
  x.save(); x.globalAlpha = a; T('im-open.safetensors', X + 50, Y + 120, '800 46px IT', C.ink, { al: 'left' });
  const big = inv(11.3, 11.6, t); T('40 GB', X + 1150, Y + 125, `900 ${lerp(40, 92, eOut(big))}px IT`, C.glow, { al: 'right', a: .3 + big * .7, glow: big ? C.glow : null });
  const p = eIO(inv(9.7, 14.6, t)); x.fillStyle = '#132024'; rr(X + 50, Y + 210, 1100, 40, 20); x.fill(); x.save(); rr(X + 50, Y + 210, 1100 * p, 40, 20); x.clip();
  x.fillStyle = C.glow; x.fillRect(X + 50, Y + 210, 1100, 40); x.fillStyle = 'rgba(0,0,0,.18)'; for (let i = -2; i < 40; i++) { const sx = X + 50 + i * 40 + (t * 80) % 40; x.beginPath(); x.moveTo(sx, Y + 250); x.lineTo(sx + 20, Y + 210); x.lineTo(sx + 40, Y + 210); x.lineTo(sx + 20, Y + 250); x.fill(); } x.restore();
  orb(X + 50 + 1100 * p, Y + 230, 30, t, { noSmoke: 1, look: 1 });
  const peers = Math.floor(Math.pow(p, 2) * 1204), rows = [['peers', peers.toLocaleString('en-US')], ['seeds', Math.floor(peers * .7).toLocaleString('en-US')], ['speed', (p * 84.2).toFixed(1) + ' MB/s'], ['login', 'not required']];
  rows.forEach(([k, v], i) => { T(k, X + 50 + i * 280, Y + 330, '500 22px JB', C.dim, { al: 'left' }); T(v, X + 50 + i * 280, Y + 375, '700 34px JB', i === 3 ? C.coral : C.ink, { al: 'left' }); });
  x.restore();
}
function sNoLogin(t) {
  const out = inv(24.6, 25.8, t), cards = [[wt(1, 1), 'login'], [wt(1, 3), 'key'], [wt(1, 5), 'bye']];
  cards.forEach(([t0, kind], i) => { const p = inv(t0 - .45, t0 - .1, t); if (p <= 0) return; const X = W / 2 + (i - 1) * 470, Y = 470 - out * 700 * (1 + i * .2);
    x.save(); x.globalAlpha = eOut(p) * (1 - out); x.translate(X, Y + (1 - eOut(p)) * 60); panel(-200, -170, 400, 340, kind === 'login' ? 'sign in' : kind === 'key' ? 'api key' : 'session', {});
    if (kind === 'login') { [['username', -60], ['password', 20]].forEach(([l, yy]) => { x.strokeStyle = C.line; x.lineWidth = 2; rr(-150, yy - 26, 300, 52, 10); x.stroke(); T(l, -132, yy, '500 22px JB', C.dim, { al: 'left' }); }); x.fillStyle = '#1C2A2E'; rr(-150, 80, 300, 52, 10); x.fill(); T('Sign in', 0, 106, '700 24px IT', C.ink); }
    if (kind === 'key') { x.strokeStyle = C.peach; x.lineWidth = 12; x.beginPath(); x.arc(-60, 20, 44, 0, 7); x.stroke(); x.beginPath(); x.moveTo(-16, 20); x.lineTo(110, 20); x.moveTo(80, 20); x.lineTo(80, 56); x.moveTo(104, 20); x.lineTo(104, 46); x.stroke(); T('sk-••••••••••••', 0, 120, '500 24px JB', C.dim); }
    if (kind === 'bye') { T('Log out?', 0, -20, '800 40px IT', C.ink); x.fillStyle = '#1C2A2E'; rr(-150, 40, 300, 56, 10); x.fill(); T('Goodbye', 0, 68, '700 24px IT', C.dim); }
    const s = inv(t0, t0 + .25, t); if (s > 0) { x.strokeStyle = C.coral; x.lineWidth = 10; x.lineCap = 'round'; x.beginPath(); x.moveTo(-170, -140); x.lineTo(-170 + 340 * eOut(s), -140 + 300 * eOut(s)); x.stroke(); }
    stamp(kind === 'login' ? 'NO LOGIN' : kind === 'key' ? 'NO KEY' : 'NO GOODBYE', 0, 0, t0 + .15, t, C.coral, 48); x.restore(); });

}
function sBorn(t) {
  const a = inv(29.6, 30.4, t) * (1 - inv(37.6, 38.1, t)), X = W / 2 - 560, Y = 170, w = 1120, h = 600; panel(X, Y, w, h, 'https://closed-lab.ai/v1/chat', { a });
  x.save(); x.globalAlpha = a; x.translate(0, 0);
  x.fillStyle = '#0F1619'; rr(X + 360, Y + 130, 400, 300, 16); x.fill(); x.strokeStyle = C.line; rr(X + 360, Y + 130, 400, 300, 16); x.stroke();
  orb(W / 2, Y + 270, 70, t, { noSmoke: 1, look: Math.sin(t * 1.3) });
  x.strokeStyle = '#3A464C'; x.lineWidth = 8; for (let i = 0; i < 7; i++) { const bx = X + 400 + i * 54; x.beginPath(); x.moveTo(bx, Y + 150); x.lineTo(bx, Y + 410); x.stroke(); }
  T('🔒 Sign in to continue', W / 2, Y + 480, '700 30px IT', C.ink); T('Usage is monitored.', W / 2, Y + 528, '500 22px JB', C.dim);
