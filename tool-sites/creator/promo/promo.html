<!doctype html><html><head><meta charset="utf-8">
<style>@font-face{font-family:Geist;src:url(fonts/inter-tight-latin-800-normal.woff2);font-weight:800}
@font-face{font-family:Geist;src:url(fonts/inter-tight-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:Geist;src:url(fonts/inter-tight-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:Geist;src:url(fonts/inter-tight-latin-500-normal.woff2);font-weight:600}</style>
<style>html,body{margin:0;background:#000}canvas{display:block;width:100vw;height:auto}</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>
const W = 1920, H = 1080, FPS = 30, DURATION = 30;
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const BG = '#F4F3EE', INK = '#121614', SUB = '#6B726D', GREEN = '#1F4D3A', LIME = '#DCEF80';
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), inv = (a, b, x) => clamp((x - a) / (b - a)), lerp = (a, b, p) => a + (b - a) * p;
const eOut = p => 1 - Math.pow(1 - p, 4), eIO = p => p < .5 ? 8 * p ** 4 : 1 - Math.pow(-2 * p + 2, 4) / 2;
const SHOTS = [
  ['home', 'Everything in one place.', .45, .35],
  ['script', 'Know your video length.', .62, .6],
  ['title', 'See where titles cut off.', .45, .6],
  ['resize', 'Every size, every platform.', .5, .5],
  ['frames', 'Pull frames from any video.', .48, .55],
  ['map', 'Animate any route.', .5, .45],
  ['earn', 'Estimate what views can earn.', .55, .45],
];
const IMG = {};
const S0 = 5.2, SL = 3.0, END = S0 + SHOTS.length * SL; // 26.2
function text(str, x, y, size, opt = {}) {
  ctx.save(); ctx.font = `${opt.w || 700} ${size}px ${opt.f || 'Geist, system-ui, sans-serif'}`; ctx.textAlign = opt.align || 'center'; ctx.textBaseline = 'alphabetic';
  ctx.fillStyle = opt.c || INK; ctx.globalAlpha = opt.a ?? 1; if (opt.ls) ctx.letterSpacing = opt.ls + 'px'; ctx.fillText(str, x, y); ctx.restore();
}
function rise(str, x, y, size, t, t0, t1, opt = {}) { // fade + rise in, fade out
  const a = eOut(inv(t0, t0 + .7, t)) * (1 - inv(t1, t1 + .45, t)); if (a <= 0) return;
  text(str, x, y + (1 - eOut(inv(t0, t0 + .9, t))) * 40 - inv(t1, t1 + .45, t) * 20, size, { ...opt, a });
}
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
function windowFrame(x, y, w, h, alpha, scale, drawInside) {
  ctx.save(); ctx.globalAlpha = alpha; ctx.translate(x + w / 2, y + h / 2); ctx.scale(scale, scale); ctx.translate(-w / 2, -h / 2);
  ctx.shadowColor = 'rgba(20,30,25,.28)'; ctx.shadowBlur = 80; ctx.shadowOffsetY = 40; rr(0, 0, w, h, 22); ctx.fillStyle = '#FFFFFF'; ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.save(); rr(0, 0, w, h, 22); ctx.clip();
  ctx.fillStyle = '#ECEBE6'; ctx.fillRect(0, 0, w, 46); ['#E0DDD4', '#E0DDD4', '#E0DDD4'].forEach((c, i) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(26 + i * 22, 23, 7, 0, 7); ctx.fill(); });
  rr(w / 2 - 210, 11, 420, 24, 12); ctx.fillStyle = '#FFFFFF'; ctx.fill(); text('creatorbenchtool.com', w / 2, 28, 14, { w: 500, c: '#6B726D' });
  ctx.save(); ctx.beginPath(); ctx.rect(0, 46, w, h - 46); ctx.clip(); ctx.translate(0, 46); drawInside(w, h - 46); ctx.restore();
  ctx.restore(); ctx.restore();
}
function drawShot(img, w, h, k, fx, fy, a) { // k: 0..1 progress within shot -> slow push toward focus
  if (!img) return; const s0 = Math.max(w / img.width, h / img.height), z = 1 + .07 * eIO(k), s = s0 * z;
  const dw = img.width * s, dh = img.height * s, ox = (w - dw) * fx, oy = (h - dh) * fy;
  ctx.save(); ctx.globalAlpha *= a; ctx.drawImage(img, lerp((w - img.width * s0) / 2, ox, eIO(k)), lerp(0, oy, eIO(k)), dw, dh); ctx.restore();
}
window.render = function (t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.globalAlpha = 1; ctx.fillStyle = BG; ctx.fillRect(0, 0, W, H);
  const g = ctx.createRadialGradient(W / 2, H * .3, 100, W / 2, H / 2, W * .8); g.addColorStop(0, 'rgba(220,239,128,.16)'); g.addColorStop(1, 'rgba(0,0,0,0)'); ctx.fillStyle = g; ctx.fillRect(0, 0, W, H);
  // intro
  rise('Creator Bench.', W / 2, H / 2 + 40, 150, t, .3, 2.3, { w: 800, ls: -4 });
  rise('14 free tools.', W / 2, H / 2 - 10, 120, t, 2.6, 4.7, { w: 800, ls: -3 });
  rise('For every upload.', W / 2, H / 2 + 120, 120, t, 3.0, 4.7, { w: 800, ls: -3, c: GREEN });
  // device sequence
  if (t > S0 - .6 && t < END + 1) {
    const enter = eOut(inv(S0 - .6, S0 + .6, t)), exit = eIO(inv(END - .2, END + .7, t));
    const ww = 1280, wh = 800, wx = (W - ww) / 2, wy = 70 + (1 - enter) * 160 - exit * 40;
    windowFrame(wx, wy, ww, wh, enter * (1 - exit), lerp(.92, 1, enter) * lerp(1, .9, exit), (w, h) => {
      const i = Math.min(SHOTS.length - 1, Math.floor((t - S0) / SL)), k = clamp((t - S0 - i * SL) / SL);
      const [name, , fx, fy] = SHOTS[Math.max(0, i)];
      if (i > 0 && k < .18) { const [pn, , pfx, pfy] = SHOTS[i - 1]; drawShot(IMG[pn], w, h, 1, pfx, pfy, 1); }
      ctx.save(); const a = i > 0 ? eOut(clamp(k / .18)) : 1; ctx.translate(0, (1 - a) * 30); drawShot(IMG[name], w, h, k, fx, fy, a); ctx.restore();
    });
    SHOTS.forEach(([, cap], i) => { const a0 = S0 + i * SL; rise(cap, W / 2, 1000, 50, t, a0 + .15, a0 + SL - .45, { w: 700, ls: -1 }); });
  }
  // end card
  rise('Free. Private. Instant.', W / 2, H / 2 - 40, 110, t, END + .4, 29.2, { w: 800, ls: -3 });
  const pa = eOut(inv(END + 1.1, END + 1.8, t)) * (1 - inv(29.2, 29.65, t));
  if (pa > 0) { ctx.save(); ctx.globalAlpha = pa; ctx.font = '600 56px Geist, system-ui, sans-serif'; const tw = ctx.measureText('creatorbenchtool.com').width;
    const y = H / 2 + 70 + (1 - pa) * 20; rr(W / 2 - tw / 2 - 44, y, tw + 88, 100, 50); ctx.fillStyle = GREEN; ctx.fill();
    text('creatorbenchtool.com', W / 2, y + 68, 56, { w: 600, c: '#FFFFFF' }); ctx.restore();
    rise('No sign-up. Nothing uploaded. Works in your browser.', W / 2, H / 2 + 250, 32, t, END + 1.6, 29.2, { w: 500, c: SUB }); }
  const fo = inv(0, .3, t) * (1 - inv(29.6, 30, t)); if (fo < 1) { ctx.fillStyle = `rgba(244,243,238,${1 - fo})`; ctx.fillRect(0, 0, W, H); }
};
window.DURATION = DURATION; window.FPS = FPS;
window.ready = Promise.all([document.fonts.load('800 40px Geist'), document.fonts.load('600 40px Geist'), document.fonts.load('500 40px Geist'),
  ...SHOTS.map(([n]) => new Promise(r => { const i = new Image(); i.onload = () => { IMG[n] = i; r(); }; i.onerror = r; i.src = 'shots/' + n + '.png'; }))]);
</script></body></html>
