<!doctype html><html><head><meta charset="utf-8">
<style>

@font-face{font-family:IT;src:url(fonts/inter-tight-latin-700-normal.woff2);font-weight:700}

</style></head><body>
<canvas id="c" width="1920" height="1080"></canvas>
<script>

let SC, EV;
const cache = new Map();

const CHORES = [['Script timing', '30 min', 30], ['Title check', '15 min', 15], ['Subtitles', '1 hr', 60], ['Thumbnail sizes', '20 min', 20], ['Map animation', '3 hrs', 180], ['Chapters', '15 min', 15], ['Captions', '15 min', 15], ['QR codes & PDFs', '15 min', 15]];
function cold(t, s) {

    ctx.save(); ctx.globalAlpha = clamp(p * 3); rr(x - 380, y, 760, 82, 24); ctx.fillStyle = CARD; ctx.fill(); txt(name, x - 345, y + 54, 38, { w: 700, c: '#FFF', align: 'left' });
    const dw = measure(dur, 32, { f: 'JB' }); rr(x + 345 - dw - 34, y + 18, dw + 34, 48, 24); ctx.fillStyle = MAG; ctx.fill(); txt(dur, x + 345 - dw / 2 - 17, y + 53, 32, { f: 'JB', c: '#FFF' }); ctx.restore(); });
  if (t > times[0]) { const h = Math.floor(total / 60), m = total % 60; txt('TOTAL PER VIDEO', 520, 905, 30, { w: 800, c: '#777', ls: 6 });
    const last = Math.max(...times.filter(x => x <= t)), bump = 1 + .07 * Math.max(0, 1 - (t - last) / .15); ctx.save(); ctx.translate(520, 1010); ctx.scale(bump, bump); txt(`${h}h ${String(m).padStart(2, '0')}m`, 0, 0, 120, { w: 900, c: MAG, ls: -4, boil: t }); ctx.restore(); }

  ctx.restore();
}
// ---------- intro ----------
function intro(t, s) {

    const pp = inv(vo(s, 1) + .6, vo(s, 1) + .9, t); if (pp > 0) { ctx.save(); ctx.translate(W / 2, 850); const k = back(pp); ctx.scale(k, k); const tw = measure('creatorbenchtool.com', 50, { w: 700 }); pill(0, 0, tw + 90, 100, GREEN); txt('creatorbenchtool.com', 0, 18, 50, { w: 700, c: '#FFF' }); ctx.restore(); }

// ---------- outro ----------
const NAMES = ['Map Animator', 'Script Timer', 'Title Preview', 'Safe Zones', 'Frame Extractor', 'Earnings', 'Image Resizer', 'Captions', 'Chapters', 'Text to SRT', 'Word Counter', 'Case Converter', 'QR Code', 'JPG to PDF'];
function outro(t, s) {

  if (g > 0) { ctx.save(); ctx.globalAlpha = g; stagger("That's all 14 tools.", W / 2, 230, 96, t, vo(s, 0), { w: 900, ls: -3 });
    NAMES.forEach((n, i) => { const p = inv(vo(s, 0) + .3 + i * .06, vo(s, 0) + .6 + i * .06, t); if (p <= 0) return; const col = i % 4, row = Math.floor(i / 4), x = 330 + col * 420 + (row === 3 ? 210 : 0), y = 400 + row * 150;
      ctx.save(); ctx.translate(x, y); const k = back(p); ctx.scale(k, k); const w = measure(n, 38, { w: 700 }) + 70; pill(0, 0, w, 90, i === 0 ? MAG : CARD); txt(n, 0, 13, 38, { w: 700, c: '#FFF' }); ctx.restore(); }); ctx.restore(); }

  if (g2 > 0) { ctx.save(); ctx.globalAlpha = g2; [['Free.', 0], ['No sign-up.', .9], ['Private.', 2.2]].forEach(([w, d], i) => pop(w, W / 2, 330 + i * 230, 190, t, a1 + d, { f: i === 2 ? 'IS' : 'IT', w: 900, c: i === 2 ? MAG : INK, ls: i === 2 ? 0 : -6, boil: t })); ctx.restore(); }
  if (t >= a2 - .1) {
    stagger('Try it free at', W / 2, 330, 64, t, a2, { w: 700, c: '#444' });
    const url = 'creatorbenchtool.com', n = Math.round(url.length * inv(a2 + .3, a2 + 1.4, t)), tw = measure(url, 92, { w: 800 }), pp = inv(a2 + .1, a2 + .4, t);
    if (pp > 0) { ctx.save(); ctx.translate(W / 2, 480); const k = back(pp); ctx.scale(k, k); pill(0, 0, tw + 160, 170, GREEN); txt(url.slice(0, n), -tw / 2, 32, 92, { w: 800, c: '#FFF', align: 'left' });
      if (Math.floor(t * 3) % 2 === 0 || n < url.length) { const cw = measure(url.slice(0, n), 92, { w: 800 }); ctx.fillStyle = LIME; ctx.fillRect(-tw / 2 + cw + 8, -44, 8, 92); } ctx.restore(); }
    stagger('link in the description', W / 2, 640, 56, t, a2 + 1.6, { f: 'IS', c: MAG });
    if (t >= a3) { const p = back(inv(a3, a3 + .35, t)); ctx.save(); ctx.translate(W / 2, 840); ctx.scale(p, p); rr(-520, -90, 1040, 180, 40); ctx.fillStyle = CARD; ctx.fill();
      ctx.beginPath(); ctx.moveTo(-380, 88); ctx.lineTo(-330, 88); ctx.lineTo(-400, 140); ctx.closePath(); ctx.fill(); txt('Which tool should I build next?', 0, 18, 54, { w: 800, c: '#FFF' }); txt('tell me in the comments', 0, 72, 34, { f: 'IS', c: LIME }); ctx.restore(); }
  }
}
// ---------- live window ----------
const WX = 288, WY = 262, WW = 1344, WH = 756, BAR = 44;
function tap(x, y, t, t0) { const p = inv(t0, t0 + .5, t); if (p <= 0 || p >= 1) return; ctx.save(); ctx.globalAlpha = 1 - p; ctx.strokeStyle = MAG; ctx.lineWidth = 6; ctx.beginPath(); ctx.arc(x, y, 18 + p * 50, 0, 7); ctx.stroke();
  ctx.globalAlpha = clamp((1 - p) * 2) * .9; ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(x, y, 22 * (1 - p * .3), 0, 7); ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 3; ctx.stroke(); ctx.restore(); }
const PAGE_OF = s => s.page;
async function live(t, s, i, list) {
  const prev = list[i - 1], next = list[i + 1], samePrev = prev && prev.page === s.page && prev.page !== 'kinetic', sameNext = next && next.page === s.page;
  const t0 = s.t0, t1 = s.t0 + s.dur;
  const inP = samePrev ? 1 : back(inv(t0, t0 + .45, t)), outP = sameNext ? 0 : eIO(inv(t1 - .2, t1 + .25, t));

    const idx = { 'map-stops': 1, 'map-styles': 1, 'map-globe': 1, 'map-export': 1 }[s.id] || (list.filter(x => x.page !== 'kinetic' && x.id !== 'intro' && !x.id.startsWith('map-')).findIndex(x => x.id === s.id) + 2);
    if (s.id !== 'intro') { rr(WX, 70, 160, 56, 28); ctx.fillStyle = INK; ctx.fill(); txt(`${String(idx).padStart(2, '0')} / 14`, WX + 80, 108, 28, { f: 'JB', c: '#FFF' }); }
