<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:IT;src:url(fonts/inter-tight-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:IT;src:url(fonts/inter-tight-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:IT;src:url(fonts/inter-tight-latin-900-normal.woff2);font-weight:900}
@font-face{font-family:IS;src:url(fonts/instrument-serif-latin-400-italic.woff2);font-style:italic}
@font-face{font-family:JB;src:url(fonts/jetbrains-mono-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:AN;src:url(fonts/anton-latin-400-normal.woff2)}
html,body{margin:0;background:#000}canvas{display:block;width:540px;height:540px}
</style></head><body><canvas id="c" width="1080" height="1080"></canvas>
<script>
// Twelve original Creator Bench motion pieces. Each is a pure function of time t in [0, 6) and loops seamlessly.
const S = 1080, cv = document.getElementById('c'), x = cv.getContext('2d'), DUR = 6;
const cl = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v)), inv = (a, b, t) => cl((t - a) / (b - a)), lerp = (a, b, p) => a + (b - a) * p;
const eOut = p => 1 - Math.pow(1 - p, 3), eIO = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2, eBack = p => { const c = 1.7; return 1 + (c + 1) * Math.pow(p - 1, 3) + c * Math.pow(p - 1, 2); };
const rnd = s => { const v = Math.sin(s * 127.1 + 311.7) * 43758.5453; return v - Math.floor(v); };
const C = { ink: '#121212', paper: '#F4F1EA', mag: '#E5157A', lime: '#DCEF80', green: '#1F4D3A', yel: '#FFE14D', blue: '#2F6BFF', night: '#0E0F14' };
const bg = c => { x.fillStyle = c; x.fillRect(0, 0, S, S); };
const out = t => 1 - inv(5.55, 5.95, t);   // shared fade-out so every loop restarts cleanly
function txt(s, X, Y, f, c, a = 1, al = 'center') { x.save(); x.globalAlpha *= a; x.font = f; x.fillStyle = c; x.textAlign = al; x.textBaseline = 'middle'; x.fillText(s, X, Y); x.restore(); }
function rr(X, Y, w, h, r) { x.beginPath(); x.roundRect(X, Y, w, h, r); }
const P = {};
// 1 Kinetic type: words slam in one at a time
P.slam = t => { bg(C.paper); const W = ['STOP', 'EDITING', 'LIKE', 'IT\'S', '2015.']; x.save(); x.globalAlpha = out(t);
  W.forEach((w, i) => { const t0 = .25 + i * .55, p = inv(t0, t0 + .28, t); if (p <= 0) return; const k = lerp(2.4, 1, eOut(p)), y = 300 + i * 125, hi = i === 1;
    x.save(); x.translate(S / 2, y); x.scale(k, k); x.globalAlpha *= cl(p * 2); if (hi) { x.fillStyle = C.mag; x.fillRect(-250, -62, 500, 124); }
    txt(w, 0, 6, '400 130px AN', hi ? '#fff' : C.ink); x.restore(); const sh = (1 - p) * 14 * Math.sin(t * 80); if (p < 1) x.translate(sh, 0); });
  x.restore(); };
// 2 Typewriter + marker highlight
P.type = t => { bg(C.night); const s = 'The best edit is the one', s2 = 'nobody notices.', n = Math.floor(s.length * inv(.3, 1.8, t)), n2 = Math.floor(s2.length * inv(1.9, 2.8, t)); x.save(); x.globalAlpha = out(t);
  txt(s.slice(0, n), 120, 460, '700 70px IT', '#fff', 1, 'left'); const hp = eIO(inv(3.0, 3.6, t)); x.font = '700 70px IT'; const w2 = x.measureText(s2).width;
  if (hp > 0) { x.fillStyle = C.yel; x.save(); x.transform(1, 0, -.15, 1, 0, 0); x.fillRect(120 + 78, 515, w2 * hp + 24, 80); x.restore(); }
  txt(s2.slice(0, n2), 120, 556, '700 70px IT', hp > .1 ? C.ink : '#fff', 1, 'left');
  const cx = 120 + x.measureText((n2 > 0 ? s2.slice(0, n2) : s.slice(0, n))).width + 6, cy = n2 > 0 ? 556 : 460; if (Math.floor(t * 2.5) % 2 === 0 && t < 3) { x.fillStyle = C.lime; x.fillRect(cx, cy - 38, 6, 76); }
  x.restore(); };
// 3 Split reveal: a word splits open to reveal another
P.split = t => { bg(C.green); x.save(); x.globalAlpha = out(t); const p = eIO(inv(1.4, 2.2, t)), gap = p * 150;
  x.save(); x.beginPath(); x.rect(0, S / 2 - gap, S, gap * 2); x.clip(); txt('creator', S / 2, S / 2, 'italic 400 230px IS', C.lime, eOut(inv(1.4, 1.9, t))); x.restore();
  x.save(); x.beginPath(); x.rect(0, 0, S, S / 2 - gap); x.clip(); txt('MANUAL', S / 2, S / 2 - gap, '400 250px AN', '#fff'); x.restore();
  x.save(); x.beginPath(); x.rect(0, S / 2 + gap, S, S / 2); x.clip(); txt('MANUAL', S / 2, S / 2 + gap, '400 250px AN', '#fff'); x.restore();
  if (p > 0) { x.fillStyle = C.lime; x.globalAlpha *= 1 - p * .6; x.fillRect(S / 2 - 380 * p, S / 2 - 3, 760 * p, 6); }
  x.globalAlpha = out(t); txt('the new way to work', S / 2, S / 2 + 230, '500 40px IT', '#fff', inv(2.4, 3, t)); x.restore(); };
// 4 Phone: notification stack
P.notif = t => { bg('#E9E4DA'); x.save(); x.globalAlpha = out(t); const px = 330, py = 120, pw = 420, ph = 840;
  x.shadowColor = 'rgba(0,0,0,.25)'; x.shadowBlur = 60; x.shadowOffsetY = 30; rr(px, py, pw, ph, 64); x.fillStyle = '#111'; x.fill(); x.shadowColor = 'transparent';
  rr(px + 16, py + 16, pw - 32, ph - 32, 50); const g = x.createLinearGradient(0, py, 0, py + ph); g.addColorStop(0, '#3B5BDB'); g.addColorStop(1, '#E5157A'); x.fillStyle = g; x.fill();
  rr(px + pw / 2 - 60, py + 30, 120, 34, 17); x.fillStyle = '#111'; x.fill(); txt('9:41', px + pw / 2, py + 160, '700 96px IT', '#fff');
  const N = [['Creator Bench', 'Your captions are ready ✓'], ['Studio', '1,000 new subscribers'], ['Reels', 'Your reel hit 50K views'], ['Payments', '₹12,480 credited']];
  N.forEach(([a, b], i) => { const t0 = .5 + i * .7, p = eBack(inv(t0, t0 + .45, t)); if (t < t0) return; const y = py + 280 + (N.length - 1 - i) * 0 + i * 118, yy = lerp(y - 80, y, cl(p));
    x.save(); x.globalAlpha *= cl(inv(t0, t0 + .2, t)); rr(px + 34, yy, pw - 68, 100, 26); x.fillStyle = 'rgba(255,255,255,.92)'; x.fill();
    rr(px + 52, yy + 22, 56, 56, 14); x.fillStyle = [C.green, C.mag, C.yel, C.blue][i]; x.fill(); txt(a, px + 124, yy + 36, '700 24px IT', '#111', 1, 'left'); txt(b, px + 124, yy + 68, '500 22px IT', '#444', 1, 'left'); x.restore(); });
  x.restore(); };
// 5 Product UI: search bar types, results cascade
P.search = t => { bg('#F7F7F5'); x.save(); x.globalAlpha = out(t); const q = 'free ai captions', n = Math.floor(q.length * inv(.4, 1.6, t)), k = eOut(inv(0, .5, t));
  x.shadowColor = 'rgba(0,0,0,.12)'; x.shadowBlur = 40; x.shadowOffsetY = 12; rr(140, 300 - 40 * (1 - k), 800, 110, 55); x.fillStyle = '#fff'; x.fill(); x.shadowColor = 'transparent';
  x.strokeStyle = '#999'; x.lineWidth = 6; x.beginPath(); x.arc(215, 352, 20, 0, 7); x.moveTo(230, 367); x.lineTo(248, 385); x.stroke();
  txt(q.slice(0, n) || 'Search tools…', 275, 355, '500 40px IT', n ? '#111' : '#aaa', 1, 'left'); if (t < 1.8 && Math.floor(t * 3) % 2 === 0) { x.font = '500 40px IT'; x.fillStyle = C.mag; x.fillRect(280 + x.measureText(q.slice(0, n)).width, 330, 4, 50); }
  ['Auto Captions', 'Caption Formatter', 'Text to SRT'].forEach((r, i) => { const t0 = 1.9 + i * .18, p = eOut(inv(t0, t0 + .4, t)); if (p <= 0) return;
    x.save(); x.globalAlpha *= p; x.translate(0, (1 - p) * 30); rr(140, 450 + i * 130, 800, 110, 24); x.fillStyle = i === 0 ? C.green : '#fff'; x.fill();
    rr(170, 478 + i * 130, 54, 54, 14); x.fillStyle = i === 0 ? C.lime : '#EEE'; x.fill(); txt(r, 250, 495 + i * 130, '700 36px IT', i === 0 ? '#fff' : '#111', 1, 'left');
    txt(['AI word-by-word captions', 'Line breaks that stick', 'Script to subtitles'][i], 250, 532 + i * 130, '500 24px IT', i === 0 ? '#cfe5d6' : '#777', 1, 'left'); x.restore(); });
  x.restore(); };
// 6 Pricing toggle: monthly → yearly, numbers roll
P.price = t => { bg(C.night); x.save(); x.globalAlpha = out(t); const on = eIO(inv(2.0, 2.4, t));
  rr(390, 190, 300, 70, 35); x.fillStyle = '#222630'; x.fill(); rr(396 + on * 144, 196, 150, 58, 29); x.fillStyle = C.lime; x.fill();
  txt('Monthly', 471, 226, '700 26px IT', on < .5 ? '#111' : '#aaa'); txt('Yearly', 615, 226, '700 26px IT', on >= .5 ? '#111' : '#aaa');
  [['Starter', 0, 0], ['Pro', 499, 4990], ['Team', 1499, 14990]].forEach(([nm, m, y], i) => { const X = 130 + i * 280, p = eOut(inv(.3 + i * .15, .8 + i * .15, t)); x.save(); x.globalAlpha *= p; x.translate(0, (1 - p) * 40);
    rr(X, 330, 260, 480, 30); x.fillStyle = i === 1 ? '#fff' : '#1A1D25'; x.fill(); txt(nm, X + 130, 400, '700 34px IT', i === 1 ? '#111' : '#fff');
    const v = Math.round(lerp(m, y, on)); txt(v ? '₹' + v.toLocaleString('en-IN') : 'Free', X + 130, 520, '900 ' + (v >= 10000 ? 46 : 54) + 'px IT', i === 1 ? C.mag : '#fff'); txt(v ? (on > .5 ? 'per year' : 'per month') : 'forever', X + 130, 580, '500 24px IT', i === 1 ? '#666' : '#aaa');
    if (i === 1 && on > .5) { const q = eBack(inv(2.3, 2.7, t)); x.save(); x.translate(X + 200, 330); x.scale(q, q); rr(-70, -26, 140, 52, 26); x.fillStyle = C.mag; x.fill(); txt('2 months free', 0, 0, '700 18px IT', '#fff'); x.restore(); }
    rr(X + 30, 700, 200, 64, 32); x.fillStyle = i === 1 ? C.green : '#2A2F3A'; x.fill(); txt('Choose', X + 130, 732, '700 26px IT', '#fff'); x.restore(); });
  x.restore(); };
// 7 Chart: bars grow with counters
P.bars = t => { bg(C.paper); x.save(); x.globalAlpha = out(t); const D = [['Mon', 32], ['Tue', 48], ['Wed', 41], ['Thu', 67], ['Fri', 88], ['Sat', 120], ['Sun', 156]];
  txt('Views this week', 130, 170, '700 46px IT', C.ink, 1, 'left'); txt('+387%', 950, 172, '900 46px IT', C.mag, eOut(inv(2.6, 3, t)), 'right');
  x.strokeStyle = '#d8d2c4'; x.lineWidth = 2; for (let g = 0; g <= 4; g++) { x.beginPath(); x.moveTo(130, 860 - g * 140); x.lineTo(950, 860 - g * 140); x.stroke(); }
  D.forEach(([d, v], i) => { const t0 = .4 + i * .18, p = eOut(inv(t0, t0 + .9, t)), h = v / 160 * 560 * p, X = 150 + i * 115;
    rr(X, 860 - h, 80, h, [12, 12, 0, 0]); x.fillStyle = i === 6 ? C.mag : C.green; x.fill(); txt(Math.round(v * p) + 'K', X + 40, 830 - h, '700 26px JB', C.ink, cl(p * 2)); txt(d, X + 40, 900, '500 26px IT', '#777'); });
  x.restore(); };
// 8 Chart: line draws with a glowing dot
P.line = t => { bg(C.night); x.save(); x.globalAlpha = out(t); const pts = Array.from({ length: 41 }, (_, i) => [130 + i * 20.5, 760 - (Math.pow(i / 40, 1.8) * 420 + Math.sin(i * .7) * 40 + rnd(i) * 30)]);
  const p = eIO(inv(.3, 3.2, t)), n = p * (pts.length - 1), k = Math.floor(n), f = n - k; x.strokeStyle = 'rgba(255,255,255,.08)'; x.lineWidth = 2; for (let g = 0; g < 5; g++) { x.beginPath(); x.moveTo(130, 300 + g * 115); x.lineTo(950, 300 + g * 115); x.stroke(); }
  const g = x.createLinearGradient(0, 300, 0, 860); g.addColorStop(0, 'rgba(220,239,128,.35)'); g.addColorStop(1, 'rgba(220,239,128,0)');
  x.beginPath(); x.moveTo(pts[0][0], 860); for (let i = 0; i <= k; i++) x.lineTo(...pts[i]); const end = k < pts.length - 1 ? [lerp(pts[k][0], pts[k + 1][0], f), lerp(pts[k][1], pts[k + 1][1], f)] : pts[k]; x.lineTo(...end); x.lineTo(end[0], 860); x.fillStyle = g; x.fill();
  x.beginPath(); x.moveTo(...pts[0]); for (let i = 1; i <= k; i++) x.lineTo(...pts[i]); x.lineTo(...end); x.strokeStyle = C.lime; x.lineWidth = 7; x.lineJoin = 'round'; x.stroke();
  x.save(); x.shadowColor = C.lime; x.shadowBlur = 40; x.fillStyle = '#fff'; x.beginPath(); x.arc(...end, 14, 0, 7); x.fill(); x.restore();
  const val = Math.round(lerp(1200, 48300, p)); rr(end[0] - 90, end[1] - 110, 180, 64, 32); x.fillStyle = '#fff'; x.fill(); txt(val.toLocaleString('en-IN'), end[0], end[1] - 78, '700 30px JB', '#111');
  txt('Subscribers', 130, 200, '700 44px IT', '#fff', 1, 'left'); x.restore(); };
// 9 Particles: dots assemble into a word, then burst
let PT = []; const makePT = () => { const c = document.createElement('canvas'); c.width = S; c.height = S; const g = c.getContext('2d'); g.font = '400 300px AN'; g.textAlign = 'center'; g.textBaseline = 'middle'; g.fillStyle = '#fff'; g.fillText('VIRAL', S / 2, S / 2);
  const d = g.getImageData(0, 0, S, S).data, a = []; for (let yy = 0; yy < S; yy += 10) for (let xx = 0; xx < S; xx += 10) if (d[(yy * S + xx) * 4 + 3] > 128) a.push([xx, yy]); return a; };
P.particles = t => { bg('#07080C'); x.save(); x.globalAlpha = out(t); const form = eIO(inv(.3, 2.0, t)), burst = eOut(inv(3.6, 5.2, t));
  PT.forEach(([tx, ty], i) => { const a = rnd(i) * 7, r = 300 + rnd(i + 3) * 500, sx = S / 2 + Math.cos(a) * r, sy = S / 2 + Math.sin(a) * r, ba = Math.atan2(ty - S / 2, tx - S / 2) + (rnd(i + 9) - .5), br = burst * (200 + rnd(i + 5) * 500);
    const X = lerp(sx, tx, form) + Math.cos(ba) * br + Math.sin(t * 3 + i) * 1.5, Y = lerp(sy, ty, form) + Math.sin(ba) * br; x.fillStyle = i % 9 === 0 ? C.mag : i % 5 === 0 ? C.lime : '#fff'; x.globalAlpha = out(t) * (1 - burst * .9);
    x.beginPath(); x.arc(X, Y, 3.8, 0, 7); x.fill(); }); x.restore(); };
// 10 Particles: orbit loader that resolves into a check
P.orbit = t => { bg(C.green); x.save(); x.globalAlpha = out(t); const done = eIO(inv(3.0, 3.6, t));
  for (let i = 0; i < 12; i++) { const a = t * 3.2 + i / 12 * Math.PI * 2, r = lerp(160, 0, done), s = lerp(10 + 8 * Math.sin(i / 12 * 6.28 + t * 6) ** 2, 0, done); x.fillStyle = i % 3 ? C.lime : '#fff'; x.beginPath(); x.arc(S / 2 + Math.cos(a) * r, S / 2 - 40 + Math.sin(a) * r, s, 0, 7); x.fill(); }
  const ck = eBack(inv(3.4, 3.9, t)); if (ck > 0) { x.save(); x.translate(S / 2, S / 2 - 40); x.scale(ck, ck); x.fillStyle = C.lime; x.beginPath(); x.arc(0, 0, 130, 0, 7); x.fill();
    const d = inv(3.6, 4.0, t); x.strokeStyle = C.green; x.lineWidth = 26; x.lineCap = x.lineJoin = 'round'; x.beginPath(); x.moveTo(-55, 0); if (d > 0) { x.lineTo(-55 + 40 * cl(d * 2), 40 * cl(d * 2)); if (d > .5) x.lineTo(-15 + 80 * (d - .5) * 2, 40 - 90 * (d - .5) * 2); } x.stroke(); x.restore(); }
  txt(done < .5 ? 'Rendering…' : 'Export ready', S / 2, 820, '700 50px IT', '#fff'); x.restore(); };
// 11 Character: a blob waves and pops a speech bubble
P.character = t => { bg('#BFE3F2'); x.save(); x.globalAlpha = out(t); x.fillStyle = '#7CC36B'; x.fillRect(0, 760, S, 320);
  const b = Math.abs(Math.sin(t * Math.PI * 1.6)) * 18, cx = 420, cy = 600 - b; x.fillStyle = 'rgba(0,0,0,.15)'; x.beginPath(); x.ellipse(cx, 772, 120 - b * 2, 18, 0, 0, 7); x.fill();
  const col = '#3FE0F0', dk = '#1F8A95'; x.lineCap = 'round'; [[-1, .3], [1, 2.5 + Math.sin(t * 9) * .5]].forEach(([s, a]) => { const sx = cx + s * 110, sy = cy, ex = sx + s * Math.sin(a) * 130, ey = sy + Math.cos(a) * 120; x.strokeStyle = dk; x.lineWidth = 32; x.beginPath(); x.moveTo(sx, sy); x.quadraticCurveTo((sx + ex) / 2 + s * 30, (sy + ey) / 2, ex, ey); x.stroke(); x.strokeStyle = col; x.lineWidth = 22; x.stroke(); });
  [-1, 1].forEach(s => { x.strokeStyle = dk; x.lineWidth = 30; x.beginPath(); x.moveTo(cx + s * 50, cy + 100); x.lineTo(cx + s * 60, 765 - b * 0); x.stroke(); x.strokeStyle = col; x.lineWidth = 20; x.stroke(); });
  x.fillStyle = col; x.strokeStyle = dk; x.lineWidth = 10; x.beginPath(); x.ellipse(cx, cy, 140, 130, 0, 0, 7); x.fill(); x.stroke();
  const blink = (t % 2.4) < .1 ? .1 : 1; [-50, 50].forEach(o => { x.fillStyle = '#fff'; x.beginPath(); x.ellipse(cx + o, cy - 30, 34, 38 * blink, 0, 0, 7); x.fill(); x.lineWidth = 6; x.stroke(); if (blink > .5) { x.fillStyle = '#111'; x.beginPath(); x.arc(cx + o + 8, cy - 26, 16, 0, 7); x.fill(); } });
  x.strokeStyle = dk; x.lineWidth = 9; x.beginPath(); x.arc(cx, cy + 30, 40, .2, Math.PI - .2); x.stroke();
  const bp = eBack(inv(1.0, 1.4, t)); if (bp > 0) { x.save(); x.translate(720, 330); x.scale(bp, bp); rr(-200, -90, 400, 180, 50); x.fillStyle = '#fff'; x.fill(); x.beginPath(); x.moveTo(-120, 80); x.lineTo(-170, 150); x.lineTo(-60, 85); x.fill();
    const msg = 'hi, creator!'; txt(msg.slice(0, Math.floor(msg.length * inv(1.3, 2.1, t))), 0, 0, '700 52px IT', '#111'); x.restore(); }
  x.restore(); };
// 12 Diagram: boxes appear and arrows connect them
P.flow = t => { bg(C.paper); x.save(); x.globalAlpha = out(t); const N = [[220, 300, 'Idea'], [540, 300, 'Script'], [860, 300, 'Record'], [860, 650, 'Edit'], [540, 650, 'Captions'], [220, 650, 'Post']];
  N.forEach(([X, Y, l], i) => { const t0 = .3 + i * .55, p = eBack(inv(t0, t0 + .35, t)); if (p <= 0) return; x.save(); x.translate(X, Y); x.scale(p, p); rr(-130, -60, 260, 120, 28); x.fillStyle = i === 5 ? C.mag : i % 2 ? '#fff' : C.green; x.fill();
    x.lineWidth = 3; x.strokeStyle = C.ink; x.stroke(); txt(l, 0, 2, '700 38px IT', i % 2 && i !== 5 ? C.ink : '#fff'); x.restore();
    if (i < N.length - 1) { const [X2, Y2] = N[i + 1], d = eIO(inv(t0 + .3, t0 + .6, t)); if (d <= 0) return; const dx = X2 - X, dy = Y2 - Y, L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L, sx = X + ux * (dx ? 140 : 70) , sy = Y + uy * (dy ? 70 : 0), ex = X2 - ux * (dx ? 140 : 70), ey = Y2 - uy * (dy ? 70 : 0);
      const mx = lerp(sx, ex, d), my = lerp(sy, ey, d); x.strokeStyle = C.ink; x.lineWidth = 6; x.setLineDash([14, 10]); x.lineDashOffset = -t * 40; x.beginPath(); x.moveTo(sx, sy); x.lineTo(mx, my); x.stroke(); x.setLineDash([]);
      if (d > .95) { x.fillStyle = C.ink; x.beginPath(); x.moveTo(ex, ey); x.lineTo(ex - ux * 22 - uy * 14, ey - uy * 22 + ux * 14); x.lineTo(ex - ux * 22 + uy * 14, ey - uy * 22 - ux * 14); x.fill(); } } });
  txt('your content workflow', S / 2, 900, 'italic 400 64px IS', C.mag, inv(3.4, 4, t)); x.restore(); };
const ID = new URLSearchParams(location.search).get('id') || 'slam';
window.render = t => { x.setTransform(1, 0, 0, 1, 0, 0); x.globalAlpha = 1; x.filter = 'none'; P[ID](t % DUR); };
window.ready = Promise.all(['500 40px IT', '700 40px IT', '900 40px IT', 'italic 400 40px IS', '700 40px JB', '400 40px AN'].map(f => document.fonts.load(f))).then(() => { PT = makePT(); render(1.5); });
</script></body></html>
