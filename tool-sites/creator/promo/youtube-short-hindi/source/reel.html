function pain(t) { const [a, b] = M.scenes.pain; if (t < a - .1 || t > b + .4) return; const sh = shake(t, b - .35, .45, 26), out = inv(b + .05, b + .35, t);

  for (let i = 0; i < n; i++) scribble(110, 970, 500 + i * 150, 60, t, b - .38 + i * .06, .22, 7 + i);
  ctx.restore(); }
function turn(t) { const [a, b] = M.scenes.turn; if (t < a || t > b + .1) return; stagger(UI.turn[0], W / 2, 860, fit(UI.turn[0], 900, 110, { w: 900 }), t, a, { w: 900, ls: -3 });
  const p = inv(a + .2, a + .45, t); if (p > 0) { ctx.save(); ctx.translate(W / 2, 1080); const k = back(p) * (1 + .04 * Math.sin(t * 30) * inv(b - .2, b, t)); ctx.scale(k, k); txt(UI.turn[1], 0, 0, 240, { f: 'IS', c: MAG, boil: t }); ctx.restore(); } }

  ctx.globalAlpha = clamp((1 - p) * 2) * .9; ctx.fillStyle = 'rgba(255,255,255,.9)'; ctx.beginPath(); ctx.arc(x, y, 34 * (1 - p * .3), 0, 7); ctx.fill(); ctx.strokeStyle = INK; ctx.lineWidth = 4; ctx.stroke(); ctx.restore(); }
async function demo(t) { const [a, b] = M.scenes.demo; if (t < a - .2 || t > b + .3) return;

  else if (im) ctx.drawImage(im, ix, iy, iw, iw * im.height / im.width);

  ctx.restore(); }
function cta(t) { const [a, b] = M.scenes.cta; if (t < a) return;
  const lp = inv(a + .05, a + .4, t); if (lp > 0) { const k = back(lp); ctx.save(); ctx.translate(W / 2, 560); ctx.scale(k, k); rr(-95, -95, 190, 190, 52); ctx.fillStyle = GREEN; ctx.fill(); leaf(0, 0, 5.6, LIME); ctx.restore(); }
