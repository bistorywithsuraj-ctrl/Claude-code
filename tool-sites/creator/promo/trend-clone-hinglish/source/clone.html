<!doctype html><html><head><meta charset="utf-8">
<style>
@font-face{font-family:IT;src:url(fonts/inter-tight-latin-700-normal.woff2);font-weight:700}
@font-face{font-family:IT;src:url(fonts/inter-tight-latin-800-normal.woff2);font-weight:800}
html,body{margin:0;background:#000}canvas{display:block;height:100vh;width:auto}
</style></head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script>
// Trend-tutorial format: painted sky, floating windows, single-word captions. Footage variants are pre-rendered by the Cartoon Characters tool.
const W = 1080, H = 1920, cv = document.getElementById('c'), ctx = cv.getContext('2d'), FPS = 30;
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x)), inv = (a, b, x) => clamp((x - a) / (b - a)), lerp = (a, b, p) => a + (b - a) * p;
const eOut = p => 1 - Math.pow(1 - p, 3), eIO = p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2, back = p => { const c1 = 1.7, c3 = c1 + 1; return 1 + c3 * Math.pow(p - 1, 3) + c1 * Math.pow(p - 1, 2); };
const rnd = s => { const x = Math.sin(s * 127.1 + 311.7) * 43758.5453; return x - Math.floor(x); };
let M, A; const cache = new Map();
function img(src) { if (!cache.has(src)) { cache.set(src, new Promise(r => { const i = new Image(); i.onload = () => r(i); i.onerror = () => r(null); i.src = src; })); if (cache.size > 160) cache.delete(cache.keys().next().value); } return cache.get(src); }
const beat = k => M.lines.find(l => l.beat === k);
// footage variant frame at time t (loops)
const fr = (v, t) => img(`assets/fv/${v}/${String(Math.floor(((t * FPS) % A.frames + A.frames) % A.frames) + 1).padStart(4, '0')}.jpg`);
// ---------- painted sky ----------
const sky = document.createElement('canvas'); sky.width = W; sky.height = H;
(() => { const g = sky.getContext('2d'), gr = g.createLinearGradient(0, 0, 0, H); gr.addColorStop(0, '#1C6FE0'); gr.addColorStop(.55, '#4FA3F2'); gr.addColorStop(1, '#BFE2FF'); g.fillStyle = gr; g.fillRect(0, 0, W, H);
  for (let c = 0; c < 26; c++) { const cx = rnd(c) * W * 1.2 - W * .1, cy = H * (.15 + rnd(c + 50) * .85), s = 60 + rnd(c + 9) * 150;
    for (let b = 0; b < 14; b++) { const bx = cx + (rnd(c * 31 + b) - .5) * s * 3.2, by = cy + (rnd(c * 17 + b) - .7) * s * .7, r = s * (.35 + rnd(c * 7 + b) * .5);
      const rg = g.createRadialGradient(bx, by - r * .3, r * .1, bx, by, r); rg.addColorStop(0, 'rgba(255,255,255,.95)'); rg.addColorStop(.7, 'rgba(240,247,255,.85)'); rg.addColorStop(1, 'rgba(220,235,255,0)'); g.fillStyle = rg; g.beginPath(); g.arc(bx, by, r, 0, 7); g.fill(); }
    g.fillStyle = 'rgba(120,160,220,.18)'; g.beginPath(); g.ellipse(cx, cy + s * .35, s * 1.6, s * .25, 0, 0, 7); g.fill(); } })();
function bgSky(t, gray) { ctx.save(); if (gray) ctx.filter = 'grayscale(1) contrast(.9)'; const dy = (t * 14) % 40; ctx.drawImage(sky, 0, -dy, W, H + 40); ctx.restore(); }
async function bgBlur(t) { const im = await fr('raw', t * .5); ctx.save(); ctx.filter = 'blur(22px) brightness(.85)'; if (im) ctx.drawImage(im, -W * .6, -60, H * 16 / 9 * 1.05, H + 120); ctx.restore(); }
// ---------- windows ----------
function rr(x, y, w, h, r) { ctx.beginPath(); ctx.roundRect(x, y, w, h, r); }
async function win(im, cx, cy, w, h, o = {}) {   // floating window with a thin dark frame and a soft shadow
  ctx.save(); ctx.translate(cx, cy); ctx.rotate(o.rot || 0); const s = o.scale ?? 1; ctx.scale(s, s); ctx.globalAlpha = o.a ?? 1;
  ctx.shadowColor = 'rgba(0,20,60,.45)'; ctx.shadowBlur = 50; ctx.shadowOffsetY = 26; rr(-w / 2 - 8, -h / 2 - 8, w + 16, h + 16, 10); ctx.fillStyle = '#111'; ctx.fill(); ctx.shadowColor = 'transparent';
  rr(-w / 2, -h / 2, w, h, 4); ctx.save(); ctx.clip(); if (o.filter) ctx.filter = o.filter;
  if (im) { const k = o.zoom || 1; ctx.drawImage(im, -w / 2 * k + (o.px || 0), -h / 2 * k + (o.py || 0), w * k, h * k); } else { ctx.fillStyle = '#222'; ctx.fillRect(-w / 2, -h / 2, w, h); }
  ctx.filter = 'none'; if (o.draw) o.draw(w, h); ctx.restore(); ctx.restore(); }
function chrome(w, h, url, typed) {   // browser bar drawn inside a window (top 70px)
  ctx.fillStyle = '#ECECEC'; ctx.fillRect(-w / 2, -h / 2, w, 72); ['#FF5F57', '#FEBC2E', '#28C840'].forEach((c, i) => { ctx.fillStyle = c; ctx.beginPath(); ctx.arc(-w / 2 + 30 + i * 26, -h / 2 + 36, 9, 0, 7); ctx.fill(); });
  rr(-w / 2 + 120, -h / 2 + 16, w - 150, 40, 20); ctx.fillStyle = '#fff'; ctx.fill(); ctx.fillStyle = '#222'; ctx.font = '700 24px IT'; ctx.textBaseline = 'middle'; ctx.fillText(url.slice(0, typed), -w / 2 + 146, -h / 2 + 37);
  if (typed < url.length || Math.floor(performance.now() / 400) % 2) { const cw = ctx.measureText(url.slice(0, typed)).width; ctx.fillRect(-w / 2 + 148 + cw, -h / 2 + 24, 3, 26); } }
function panel(x, y, rows, t0, t) {   // small dark settings panel (like an editor's effect controls)
  const p = eOut(inv(t0, t0 + .3, t)); if (p <= 0) return; ctx.save(); ctx.globalAlpha = p; ctx.translate(x, y + (1 - p) * 40);
  const w = 560, h = 70 + rows.length * 78; ctx.shadowColor = 'rgba(0,0,0,.5)'; ctx.shadowBlur = 30; rr(0, 0, w, h, 18); ctx.fillStyle = 'rgba(24,26,30,.96)'; ctx.fill(); ctx.shadowColor = 'transparent';
  ctx.fillStyle = '#9aa3ad'; ctx.font = '700 20px IT'; ctx.fillText('BLEND INTO THE FOOTAGE', 28, 42);
  rows.forEach((r, i) => { const yy = 96 + i * 78; ctx.fillStyle = '#fff'; ctx.font = '700 26px IT'; ctx.fillText(r.label, 28, yy);
    if (r.type === 'slider') { const v = r.v(t); rr(28, yy + 18, w - 56, 10, 5); ctx.fillStyle = '#3a3f47'; ctx.fill(); rr(28, yy + 18, (w - 56) * v, 10, 5); ctx.fillStyle = '#5FD38D'; ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(28 + (w - 56) * v, yy + 23, 15, 0, 7); ctx.fill(); ctx.fillStyle = '#9aa3ad'; ctx.font = '700 22px IT'; ctx.textAlign = 'right'; ctx.fillText(Math.round(v * 100), w - 28, yy); ctx.textAlign = 'left'; }
    else { const on = r.v(t); rr(w - 110, yy - 30, 82, 44, 22); ctx.fillStyle = on > .5 ? '#5FD38D' : '#555'; ctx.fill(); ctx.fillStyle = '#fff'; ctx.beginPath(); ctx.arc(w - 88 + on * 38, yy - 8, 17, 0, 7); ctx.fill(); } });
  ctx.restore(); }
function bubble(cx, cy, t0, t) {   // comment pop-up
  const p = inv(t0, t0 + .3, t); if (p <= 0) return; const k = back(p), w = 660, h = 150; ctx.save(); ctx.translate(cx, cy); ctx.scale(k, k); ctx.rotate(-.03);
  ctx.shadowColor = 'rgba(0,0,0,.35)'; ctx.shadowBlur = 40; ctx.shadowOffsetY = 14; rr(-w / 2, -h / 2, w, h, 75); ctx.fillStyle = '#fff'; ctx.fill(); ctx.shadowColor = 'transparent';
  const ax = -w / 2 + 78; ctx.fillStyle = '#F2B66B'; ctx.beginPath(); ctx.arc(ax, 0, 50, 0, 7); ctx.fill(); ctx.fillStyle = '#7A4A2A'; ctx.beginPath(); ctx.arc(ax, -12, 20, 0, 7); ctx.fill(); ctx.beginPath(); ctx.ellipse(ax, 34, 32, 22, 0, Math.PI, 0); ctx.fill();
  ctx.strokeStyle = '#E5157A'; ctx.lineWidth = 5; ctx.beginPath(); ctx.arc(ax, 0, 54, 0, 7); ctx.stroke();
  ctx.fillStyle = '#111'; ctx.font = '700 46px IT'; ctx.fillText('someone', ax + 80, -6); ctx.font = '800 46px IT'; ctx.fillText('TREND!!!!', ax + 300, -6);
  ctx.fillStyle = '#777'; ctx.font = '700 28px IT'; ctx.fillText('1d     3 likes     Reply', ax + 80, 44); ctx.restore(); }
function boxes(t0, t1, t, wx, wy, ww, wh) {   // the "overlay rectangles" moment: tinted boxes snap onto each character
  if (t < t0 || t > t1) return; const a = Math.min(inv(t0, t0 + .15, t), 1 - inv(t1 - .3, t1, t));
  A.boxes.forEach((b, i) => { const p = eOut(inv(t0 + i * .12, t0 + i * .12 + .2, t)); ctx.save(); ctx.globalAlpha = a * .55 * p; ctx.fillStyle = i % 2 ? '#F2C76B' : '#FFFFFF';
    ctx.fillRect(wx - ww / 2 + b[0] * ww, wy - wh / 2 + b[1] * wh, b[2] * ww * p, b[3] * wh); ctx.globalAlpha = a; ctx.strokeStyle = '#6aa9ff'; ctx.lineWidth = 3; ctx.strokeRect(wx - ww / 2 + b[0] * ww, wy - wh / 2 + b[1] * wh, b[2] * ww * p, b[3] * wh); ctx.restore(); }); }
// ---------- single-word captions ----------
function caption(t) { let w = null; for (const l of M.lines) for (let i = 0; i < l.words.length; i++) { const x = l.words[i], nx = l.words[i + 1]; if (t >= x.s && t < (nx ? nx.s : x.e + .25)) w = x; } if (!w) return;
  const s = w.w.replace(/[,.!?]+$/, '').toLowerCase(), p = inv(w.s, w.s + .08, t); ctx.save(); ctx.font = '700 46px IT'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.shadowColor = 'rgba(0,0,0,.85)'; ctx.shadowBlur = 10; ctx.shadowOffsetY = 2; ctx.fillStyle = '#fff'; ctx.globalAlpha = .4 + .6 * p; ctx.fillText(s, W / 2, 1000); ctx.restore(); }
// ---------- timeline ----------
window.render = async function (t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0); ctx.filter = 'none'; ctx.globalAlpha = 1; ctx.fillStyle = '#000'; ctx.fillRect(0, 0, W, H);
  const B = k => beat(k).t0 - .15, hook = beat('hook'), FW = 1080, FH = 608;
  if (t < B('open')) {
    const cut = hook.t0 + 3.3;
    if (t < cut) { const im = await fr('final', t + 1); if (im) ctx.drawImage(im, 0, (H - FH) / 2, FW, FH); }
    else { bgSky(t); const lt = t - cut, p = eOut(inv(0, .35, lt)); await win(await fr('final', t + 1), W / 2, 960, 900, 506, { scale: .85 + .15 * p, rot: -.02 * (1 - p) });
      const kinds = ['k0', 'k1', 'k2', 'k3', 'k4', 'k5', 'k6', 'k7']; for (let i = 0; i < kinds.length; i++) { const q = inv(.3 + i * .22, .55 + i * .22, lt); if (q <= 0) continue; const im = await img(`assets/kinds/${i}.png`), a = i * .8 + .3, R = 600;
        ctx.save(); ctx.translate(W / 2 + Math.cos(a) * 420, 960 + Math.sin(a) * R); ctx.scale(back(q) * .9, back(q) * .9); ctx.rotate(Math.sin(t * 3 + i) * .1); if (im) ctx.drawImage(im, -110, -110, 220, 220); ctx.restore(); } }
  } else if (t < B('pick')) {
    const lt = t - B('open'), o = beat('open'), url = 'creatorbenchtool.com', typed = Math.round(url.length * inv(.25, 1.2, lt)); bgSky(t);
    const p = back(inv(0, .35, lt)), shot = await img('assets/site.jpg'); await win(lt > 1.4 ? shot : null, W / 2, 960, 920, 690, { scale: .7 + .3 * p, rot: (1 - p) * .05, draw: (w, h) => { if (lt <= 1.4) { ctx.fillStyle = '#fff'; ctx.fillRect(-w / 2, -h / 2, w, h); } chrome(w, h, url, typed); } });
  } else if (t < B('drag')) {
    const lt = t - B('pick'); await bgBlur(t); const p = back(inv(0, .35, lt)); await win(await img(`assets/pick/${String(Math.floor(lt * FPS) % 60).padStart(4, '0')}.jpg`), W / 2, 920, 900, 540, { scale: .75 + .25 * p });
    const w = beat('pick').words.find(x => /TREND/i.test(x.w)); bubble(W / 2 + 40, 1290, (w ? w.s : beat('pick').t0 + 1.5) - .1, t);
  } else if (t < B('how')) {
    const lt = t - B('drag'); bgSky(t); const p = back(inv(0, .3, lt)); await win(await img(`assets/drag/${String(Math.min(A.dragFrames - 1, Math.floor(lt * FPS))).padStart(4, '0')}.jpg`), W / 2, 960, 940, 529, { scale: .8 + .2 * p, rot: (1 - p) * -.04 });
  } else if (t < B('better')) {
    const lt = t - B('how'), m0 = beat('match').t0, m1 = beat('match').t1; bgSky(t);
    const k = inv(m0 + .2, m1 - .2, t), zoom = 1 + .06 * inv(B('how'), B('better'), t), cx = W / 2, cy = 860, ww = 940, wh = 529;
    const a = await fr('plain', t), b = await fr('match', t);
    await win(a, cx, cy, ww, wh, { zoom, draw: (w, h) => { if (b && k > 0) { ctx.globalAlpha = k; ctx.drawImage(b, -w / 2 * zoom, -h / 2 * zoom, w * zoom, h * zoom); ctx.globalAlpha = 1; } } });
    boxes(m0 - .05, m0 + 1.4, t, cx, cy, ww, wh);
    panel(W / 2 - 280, 1200, [{ label: 'Color match', type: 'slider', v: tt => .65 * eIO(inv(m0 + .2, m1 - .2, tt)) }], m0 - .1, t);
  } else if (t < B('shadow')) {
    const lt = t - B('better'), p = eOut(inv(0, .25, lt)); bgSky(t, true); await win(await fr('match', t), W / 2, 900, 900, 506, { rot: -.09 * p, scale: 1 - .05 * p, filter: 'grayscale(1)' });
  } else if (t < beat('ground').t1 + .4) {
    const s0 = beat('shadow').t0, s1 = beat('shadow').t1, g0 = beat('ground').t0, g1 = beat('ground').t1; bgSky(t);
    const k1 = inv(s0 + .1, s1 - .3, t), k2 = inv(g0 + .9, g0 + 1.8, t), cx = W / 2, cy = 860, ww = 940, wh = 529;
    const a = await fr('match', t), b = await fr('shadow', t), c = await fr('final', t);
    await win(a, cx, cy, ww, wh, { draw: (w, h) => { if (b && k1 > 0) { ctx.globalAlpha = k1; ctx.drawImage(b, -w / 2, -h / 2, w, h); } if (c && k2 > 0) { ctx.globalAlpha = k2; ctx.drawImage(c, -w / 2, -h / 2, w, h); } ctx.globalAlpha = 1; } });
    panel(W / 2 - 280, 1200, [{ label: 'Shadow under feet', type: 'toggle', v: tt => eOut(inv(s0 + .1, s0 + .35, tt)) }, { label: 'Softness', type: 'slider', v: tt => .3 * eIO(inv(s0 + 1.4, s1, tt)) }, { label: 'Feet in the grass', type: 'toggle', v: tt => eOut(inv(g0 + .8, g0 + 1.05, tt)) }], s0 - .1, t);
  } else {
    const lt = t - (beat('ground').t1 + .4), p = eIO(inv(0, .6, lt)), im = await fr('final', t);
    ctx.save(); const s = lerp(940 / 1080, 1, p); ctx.translate(W / 2, lerp(860, 960, p)); ctx.scale(s, s); if (im) ctx.drawImage(im, -FW / 2, -FH / 2, FW, FH); ctx.restore();
    const q = eOut(inv(.5, .9, lt)); if (q > 0) { ctx.save(); ctx.globalAlpha = q; ctx.font = '800 44px IT'; ctx.textAlign = 'center'; ctx.fillStyle = '#fff'; ctx.fillText('creatorbenchtool.com', W / 2, 1420); ctx.font = '700 30px IT'; ctx.fillStyle = '#9fd8b4'; ctx.fillText('free · no watermark · no sign-up', W / 2, 1475); ctx.restore(); }
  }
  caption(t);
  const cuts = ['open', 'pick', 'drag', 'how', 'better', 'shadow'].map(B); const c = cuts.find(c => t >= c && t < c + 2 / FPS);   // tiny flash on cuts
  if (c !== undefined) { ctx.fillStyle = 'rgba(255,255,255,.18)'; ctx.fillRect(0, 0, W, H); }
  const fo = inv(M.dur - .25, M.dur, t); if (fo > 0) { ctx.fillStyle = `rgba(0,0,0,${fo})`; ctx.fillRect(0, 0, W, H); }
};
window.ready = (async () => { M = await (await fetch('meta.json')).json(); A = await (await fetch('assets/assets.json')).json(); window.DURATION = M.dur;
  await Promise.all(['700 40px IT', '800 40px IT'].map(f => document.fonts.load(f))); })();
</script></body></html>
